- name: roboshop instance management
  hosts: local
  connection: local
  # for connecting to AWS ansible run the python code in background so we need to execute this command pip3.9 install boto3 botocore
  vars:
    instances: ["mongodb","redis","mysql","rabbitmq"]
    image_id: ami-0220d79f3f480ecf5
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      #state: present
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      security_groups: 
      - "roboshop-{{ item }}"
      - roboshop-common
    loop: "{{ instances }}"  
    register: ec2_output

  # - name: print output
  #   debug:
  #     msg: "{{ ec2_output }}"

  - name: create route 53 record
    debug:
      msg: "Instance name: {{ item.item }} PrivateIp: {{ item.instances[0].private_ip_address }}"
    loop: "{{ ec2_output.results }}"
